<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SortSense</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/script.js"></script>
    <style>
        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .filter-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .risk-progress-container {
            width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 4px;
        }

        .risk-progress-bar {
            height: 100%;
            border-radius: 3px;
        }

        .admin-sidebar {
            background: rgba(30, 30, 40, 0.95);
        }

        .table-action-btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            color: white;
            margin-right: 5px;
            font-size: 0.8rem;
        }

        .btn-deactivate {
            background: #EF4444;
        }

        .btn-activate {
            background: #10B981;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Sort Sense</span>
                    <span class="badge"
                        style="background: var(--accent-color); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">ADMIN</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admin-dashboard.html"><i class="ri-dashboard-3-line"></i><span>Overview</span></a></li>
                    <li class="active"><a href="#"><i class="ri-user-settings-line"></i><span>User Management</span></a>
                    </li>
                    <li><a href="admin-recent-activity.html"><i class="ri-history-line"></i><span>Recent
                                Activity</span></a>
                    </li>
                    <li><a href="admin-waste-data.html"><i class="ri-delete-bin-2-line"></i><span>Waste Data</span></a>
                    </li>
                    <li><a href="admin-special-waste.html"><i class="ri-alert-fill"></i><span>Special Waste
                                Requests</span></a></li>
                    <li><a href="admin-analytics.html"><i class="ri-bar-chart-box-line"></i><span>Analytics</span></a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn"><i class="ri-logout-box-line"></i><span>Logout</span></button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h2>User Management</h2>
                <div class="header-search">
                    <i class="ri-search-line"></i>
                    <input type="text" id="userSearchInput" placeholder="Search users/email..." onkeyup="filterUsers()">
                </div>
                <div class="header-profile">
                    <div class="user-info"><span id="adminNameDisplay" style="font-weight: 600;">Admin User</span></div>
                </div>
            </header>

            <div class="dashboard-content" style="padding: 2rem;">

                <!-- Stat Cards -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.8rem; flex-wrap: wrap;">
                    <div style="width: 220px; background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.25); border-radius: 14px; padding: 1.1rem 1.4rem; display: flex; align-items: center; gap: 0.9rem; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0;"
                        onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 6px 20px rgba(99,102,241,0.18)'"
                        onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='none'">
                        <div
                            style="width: 42px; height: 42px; border-radius: 11px; background: rgba(99,102,241,0.15); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #6366f1; flex-shrink: 0;">
                            <i class="ri-user-3-line"></i>
                        </div>
                        <div>
                            <div id="statTotalUsers"
                                style="font-size: 1.6rem; font-weight: 700; color: #e2e8f0; line-height: 1.1;">â€”</div>
                            <div style="font-size: 0.78rem; color: #94a3b8; margin-top: 2px; white-space: nowrap;">Top
                                Users</div>
                        </div>
                    </div>
                    <div style="width: 220px; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 14px; padding: 1.1rem 1.4rem; display: flex; align-items: center; gap: 0.9rem; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0;"
                        onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 6px 20px rgba(16,185,129,0.18)'"
                        onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='none'">
                        <div
                            style="width: 42px; height: 42px; border-radius: 11px; background: rgba(16,185,129,0.15); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #10b981; flex-shrink: 0;">
                            <i class="ri-building-2-line"></i>
                        </div>
                        <div>
                            <div id="statCentersRegistered"
                                style="font-size: 1.6rem; font-weight: 700; color: #e2e8f0; line-height: 1.1;">â€”</div>
                            <div style="font-size: 0.78rem; color: #94a3b8; margin-top: 2px; white-space: nowrap;">
                                Centers Registered</div>
                        </div>
                    </div>
                </div>

                <!-- Filters Section -->
                <div class="filter-section" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <button class="filter-btn active" id="typeBtn-users"    onclick="setTypeFilter('users')">Users</button>
                    <button class="filter-btn"         id="typeBtn-centers" onclick="setTypeFilter('centers')">Centers</button>
                    <button class="filter-btn"         id="typeBtn-all"     onclick="setTypeFilter('all')">Show All</button>
                    <span style="width:1px; height:24px; background:#334155; border-radius:2px; display:inline-block;"></span>
                    <button class="filter-btn"         id="statusBtn-active"    onclick="setStatusFilter('active')">Active</button>
                    <button class="filter-btn"         id="statusBtn-flagged"   onclick="setStatusFilter('flagged')">Flagged</button>
                    <button class="filter-btn"         id="statusBtn-suspended" onclick="setStatusFilter('suspended')">Suspended</button>
                    <button class="filter-btn"         id="statusBtn-high-risk" onclick="setStatusFilter('high-risk')">High Risk (&gt;50)</button>
                </div>
                <div class="section-card"
                    style="background: rgba(30, 41, 59, 0.5); padding: 1.5rem; border-radius: 16px;">
                    <div class="section-title">
                        <h3 id="tableTitle">Registered Users</h3>
                    </div>
                    <table class="recent-table" style="width: 100%; border-collapse: collapse; color: #e2e8f0;">
                        <thead>
                            <tr style="border-bottom: 1px solid #334155; text-align: left;">
                                <th style="padding: 10px;">User</th>
                                <th style="padding: 10px;">Email</th>
                                <th style="padding: 10px;">Risk Score</th>
                                <th style="padding: 10px;">Reports</th>
                                <th style="padding: 10px;">Status</th>
                                <th style="padding: 10px;">Last Active</th>
                                <th style="padding: 10px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="6" style="text-align:center; padding:20px;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-users.js"></script>
</body>

</html>
