<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SortSense</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/script.js"></script>
    <style>
        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .filter-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .risk-progress-container {
            width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 4px;
        }

        .risk-progress-bar {
            height: 100%;
            border-radius: 3px;
        }

        .admin-sidebar {
            background: rgba(30, 30, 40, 0.95);
        }

        .table-action-btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            color: white;
            margin-right: 5px;
            font-size: 0.8rem;
        }

        .btn-deactivate {
            background: #EF4444;
        }

        .btn-activate {
            background: #10B981;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Sort Sense</span>
                    <span class="badge"
                        style="background: var(--accent-color); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">ADMIN</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admin-dashboard.html"><i class="ri-dashboard-3-line"></i><span>Overview</span></a></li>
                    <li class="active"><a href="#"><i class="ri-user-settings-line"></i><span>User Management</span></a>
                    </li>
                    <li><a href="admin-recent-activity.html"><i class="ri-history-line"></i><span>Recent
                                Activity</span></a>
                    </li>
                    <li><a href="admin-waste-data.html"><i class="ri-delete-bin-2-line"></i><span>Waste Data</span></a>
                    </li>
                    <li><a href="admin-special-waste.html"><i class="ri-alert-fill"></i><span>Special Waste
                                Requests</span></a></li>
                    <li><a href="admin-analytics.html"><i class="ri-bar-chart-box-line"></i><span>Analytics</span></a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn"><i class="ri-logout-box-line"></i><span>Logout</span></button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h2>User Management</h2>
                <div class="header-search">
                    <i class="ri-search-line"></i>
                    <input type="text" id="userSearchInput" placeholder="Search users/email..." onkeyup="filterUsers()">
                </div>
                <div class="header-profile">
                    <div class="user-info"><span id="adminNameDisplay" style="font-weight: 600;">Admin User</span></div>
                </div>
            </header>

            <div class="dashboard-content" style="padding: 2rem;">
                <!-- Filters Section -->
                <div class="filter-section" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="filter-btn active" onclick="setStatusFilter('all')">Show All</button>
                    <button class="filter-btn" onclick="setStatusFilter('active')">Active</button>
                    <button class="filter-btn" onclick="setStatusFilter('flagged')">Flagged</button>
                    <button class="filter-btn" onclick="setStatusFilter('suspended')">Suspended</button>
                    <button class="filter-btn" onclick="setStatusFilter('high-risk')">High Risk (>50)</button>
                </div>
                <div class="section-card"
                    style="background: rgba(30, 41, 59, 0.5); padding: 1.5rem; border-radius: 16px;">
                    <div class="section-title">
                        <h3>Registered Users</h3>
                    </div>
                    <table class="recent-table" style="width: 100%; border-collapse: collapse; color: #e2e8f0;">
                        <thead>
                            <tr style="border-bottom: 1px solid #334155; text-align: left;">
                                <th style="padding: 10px;">User</th>
                                <th style="padding: 10px;">Email</th>
                                <th style="padding: 10px;">Risk Score</th>
                                <th style="padding: 10px;">Reports</th>
                                <th style="padding: 10px;">Status</th>
                                <th style="padding: 10px;">Last Active</th>
                                <th style="padding: 10px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="6" style="text-align:center; padding:20px;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-users.js"></script>
</body>

</html>
