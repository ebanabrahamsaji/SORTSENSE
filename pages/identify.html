<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analysis - SortSense</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .analysis-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HIDE CONFIDENCE METERS AS REQUESTED */
        .confidence-meter,
        #confidenceText,
        .text-sm:has(#confidenceText) {
            display: none !important;
        }

        .upload-section {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 2px dashed #e2e8f0;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .preview-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .results-section {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: slideUp 0.5s ease-out;
        }

        @media (max-width: 768px) {
            .results-section {
                grid-template-columns: 1fr;
            }
        }

        .info-card {
            background: rgba(255, 255, 255, 0.98);
            /* Less transparent for visibility */
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        /* Force dark text for visibility */
        .info-card p,
        .guideline-box p,
        .guideline-box h4,
        #analysisMessage {
            color: #0f172a !important;
            font-weight: 500;
        }

        .category-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.4rem;
            /* Slightly larger */
            margin-bottom: 1rem;
            background: var(--primary-color);
            color: white;
        }

        /* Removed confidence styles */
        .confidence-meter,
        #confidenceText,
        .text-sm:has(#confidenceText) {
            display: none !important;
        }

        .guideline-box {
            background: #f0fdf4;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            border-left: 4px solid var(--success-color);
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-analyze {
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Reusing Sidebar for consistency -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Sort Sense</span>
                    <i class="ri-leaf-fill logo-icon"></i>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="ri-dashboard-line"></i><span>Dashboard</span></a></li>
                    <li class="active"><a href="#"><i class="ri-camera-lens-line"></i><span>Identify</span></a></li>
                    <li><a href="profile.html"><i class="ri-settings-4-line"></i><span>Profile</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>AI Waste Analysis</h2>
                <div class="header-profile">
                    <div class="user-info">
                        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User" alt="Profile">
                    </div>
                </div>
            </header>

            <div class="analysis-container">
                <!-- Upload Section -->
                <div class="upload-section" id="dropZone">
                    <i class="ri-upload-cloud-2-line" style="font-size: 3rem; color: #cbd5e1;"></i>
                    <h3>Click or Drag & Drop Image</h3>
                    <p class="text-sm text-gray-500">Supports JPG, PNG</p>
                    <input type="file" id="fileInput" hidden accept="image/*">
                    <img id="preview" class="preview-image" alt="Preview">
                    <br>
                    <button class="btn-analyze" id="analyzeBtn">
                        <i class="ri-magic-line"></i> Identify Waste
                    </button>
                </div>

                <!-- Results Section -->
                <div class="results-section" id="resultsArea">
                    <div class="info-card">
                        <span class="category-badge" id="categoryBadge">Plastic</span>
                        <div class="confidence-meter">
                            <div class="confidence-fill" id="confidenceBar"></div>
                        </div>
                        <p class="text-sm">Confidence: <span id="confidenceText">0%</span></p>
                        <p id="analysisMessage" class="text-sm"
                            style="color: #64748b; margin-top: 0.5rem; font-style: italic;"></p>

                        <div class="guideline-box">
                            <h4><i class="ri-information-line"></i> Disposal Guide</h4>
                            <p id="disposalText">Loading guidance...</p>
                        </div>

                        <div class="guideline-box" style="background: #fff7ed; border-color: #f97316;">
                            <h4><i class="ri-alarm-warning-line"></i> Kerala Specific Rule</h4>
                            <p id="keralaRule">Loading rules...</p>
                        </div>
                    </div>

                    <div class="map-card">
                        <h3 style="margin-bottom: 1rem;">Nearest Collection Centers</h3>
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../js/config.js"></script>
    <script src="../js/analysis.js"></script>
</body>

</html>
