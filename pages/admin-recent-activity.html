<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Activity - SortSense Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .admin-sidebar {
            background: rgba(30, 30, 40, 0.95);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-analyzed {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
        }

        .status-completed {
            background: rgba(59, 130, 246, 0.1);
            color: #3B82F6;
        }

        .activity-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .activity-row:hover {
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .filter-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-item label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .filter-item select,
        .filter-item input {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Sort Sense</span>
                    <span class="badge"
                        style="background: var(--accent-color); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">ADMIN</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admin-dashboard.html"><i class="ri-dashboard-3-line"></i><span>Overview</span></a></li>
                    <li><a href="admin-users.html"><i class="ri-user-settings-line"></i><span>User Management</span></a>
                    </li>
                    <li class="active"><a href="admin-recent-activity.html"><i class="ri-history-line"></i><span>Recent
                                Activity</span></a></li>
                    <li><a href="admin-waste-data.html"><i class="ri-delete-bin-2-line"></i><span>Waste Data</span></a>
                    </li>
                    <li><a href="admin-special-waste.html"><i class="ri-alert-fill"></i><span>Special Waste
                                Requests</span></a></li>
                    <li><a href="#"><i class="ri-bar-chart-box-line"></i><span>Analytics</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn"><i class="ri-logout-box-line"></i><span>Logout</span></button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <i class="ri-search-line"></i>
                    <input type="text" id="activitySearch" placeholder="Search activities...">
                </div>
                <div class="header-profile">
                    <div class="user-info"><span style="font-weight: 600;">Admin Central</span></div>
                </div>
            </header>

            <div class="dashboard-content" style="padding: 2rem;">
                <div class="welcome-section" style="margin-bottom: 2rem;">
                    <h1>User <span class="gradient-text">Activity Log</span></h1>
                    <p style="color: var(--text-secondary);">Comprehensive audit trail of all actions across the
                        platform.</p>
                </div>

                <div class="filter-container">
                    <div class="filter-item">
                        <label>Role</label>
                        <select id="roleFilter">
                            <option value="all">All Roles</option>
                            <option value="USER">User</option>
                            <option value="CENTER_ADMIN">Center Admin</option>
                            <option value="STAFF">Staff</option>
                            <option value="ADMIN">System Admin</option>
                        </select>
                    </div>
                </div>

                <div class="section-card"
                    style="background: rgba(30, 41, 59, 0.5); padding: 1.5rem; border-radius: 16px; overflow-x: auto;">
                    <table class="recent-table" style="width: 100%; border-collapse: collapse; color: #e2e8f0;">
                        <thead>
                            <tr style="border-bottom: 1px solid #334155; text-align: left;">
                                <th style="padding: 1rem;">Time</th>
                                <th style="padding: 1rem;">User</th>
                                <th style="padding: 1rem;">Action</th>
                                <th style="padding: 1rem;">Status</th>
                                <th style="padding: 1rem;">Details</th>
                            </tr>
                        </thead>
                        <tbody id="activityTableBody">
                            <tr>
                                <td colspan="5" style="text-align:center; padding:3rem;">
                                    <i class="ri-loader-4-line ri-spin"
                                        style="font-size: 2rem; color: var(--primary-color);"></i>
                                    <p>Loading activities...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Activity Detail Modal -->
    <div id="activityModal" class="modal-overlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div class="modal-content"
            style="background:#1e293b; padding:2rem; border-radius:16px; width:500px; max-width:95%; border: 1px solid rgba(255,255,255,0.1);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="color:white; margin:0;">Activity Details</h3>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:1.5rem;"><i
                        class="ri-close-line"></i></button>
            </div>
            <div id="modalBody" style="color:var(--text-secondary); line-height:1.6;">
                <!-- Details injected here -->
            </div>
        </div>
    </div>

    <script src="../js/admin-recent-activity.js"></script>
</body>

</html>
