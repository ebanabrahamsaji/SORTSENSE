<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SortSense AI - Free Image Analysis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .upload-section {
            border: 2px dashed #ccc;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #666;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }

        .category {
            font-size: 1.5em;
            color: #2c3e50;
        }

        .confidence {
            color: #888;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>SortSense AI</h1>
        <p>Upload a waste image to classify it.</p>

        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <p>Click to Upload Image</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage()">
            <img id="preview" />
        </div>

        <button onclick="analyzeImage()">Analyze Waste</button>

        <div id="result">
            <p>Category: <span class="category" id="resCategory"></span></p>
            <p>Confidence: <span class="confidence" id="resConfidence"></span></p>
        </div>
    </div>

    <script>
        function previewImage() {
            const file = document.getElementById('fileInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function analyzeImage() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select an image first!");
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            const resultDiv = document.getElementById('result');
            const catSpan = document.getElementById('resCategory');
            const confSpan = document.getElementById('resConfidence');

            resultDiv.style.display = 'none';

            try {
                // Send to Node.js Backend (which proxies to Python)
                // Assuming Node.js is running on port 8000
                const response = await fetch('http://localhost:8000/api/waste/identify', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || 'Error analysing image');
                }

                const data = await response.json();

                catSpan.textContent = data.category;
                confSpan.textContent = data.confidence + "%";
                resultDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Analysis failed: " + error.message);
            }
        }
    </script>

</body>

</html>
